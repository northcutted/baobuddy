name: Release Maintenance
on:
  schedule:
    - cron: 17 */6 * * *
  workflow_dispatch:
    inputs:
      action:
        description: Maintenance action
        type: choice
        options:
          - App Store status
        default: App Store status
permissions:
  contents: read
concurrency:
  group: app-store-observe
  cancel-in-progress: false
jobs:
  observe:
    uses: northcutted/ios-release-workflows/.github/workflows/observe.yml@a3c32bcae61a8a174f3c5ea6a4ba0b623aaaf33a
    with:
      config: .github/ios-release.json
      platform_revision: a3c32bcae61a8a174f3c5ea6a4ba0b623aaaf33a
    permissions:
      contents: read
      actions: read
      attestations: read
    if: vars.RELEASE_DISTRIBUTION_ENABLED == 'true'
    secrets:
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
      APP_STORE_CONNECT_API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}

